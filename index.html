/* ── Layout responsivo ─────────────────────────────────── */

  overflow: hidden;
  position: relative;
}

/* ── Scroll area ────────────────────────────────────────── */

/* ── Cards ──────────────────────────────────────────────── */
.card {

}

/* ── Pill buttons ───────────────────────────────────────── */
.btn-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;

  border: none;
  border-radius: 20px;

.btn-pill:hover { background: #e4e0da; }
.btn-pill.active { background: #1a1a1a; color: #fff; }

/* ── Transaction rows ───────────────────────────────────── */

  gap: 12px;
  padding: 12px 16px;

  transition: background .1s;

.tx-row:active { background: #f5f2ec; }
@media (hover: hover) { .tx-row:hover { background: #f5f2ec; } }

.tx-dot {

  justify-content: center;

// ── Helpers ──────────────────────────────────────────────

function fmt(n, showSign = false) {
  const abs = Math.abs(n);
  const s = abs >= 1000000
    ? `$ ${(abs / 1000000).toFixed(2).replace('.', ',')}M`
    : abs >= 1000
    ? `$ ${Math.round(abs / 1000).toLocaleString('es-AR')}k`
    : `$ ${abs.toLocaleString('es-AR')}`;
  if (!showSign) return s;
  return (n >= 0 ? '+' : '−') + ' ' + s;
}

function fmtFull(n) {
  return `$ ${Math.abs(n).toLocaleString('es-AR')}`;
}

function catColor(cat) { return CAT_COLORS[cat] || '#b0aaaa'; }

function groupByDate(txs) {
  const groups = {};
  txs.forEach(tx => {
    if (!groups[tx.date]) groups[tx.date] = [];
    groups[tx.date].push(tx);
  });
  return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
}

function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
}

const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

function monthIdToLabelFull(id) {
  const mm = parseInt(id.slice(0, 2), 10) - 1, yy = id.slice(2);
  return `${MONTH_NAMES[mm]} 20${yy}`;
}
function monthIdToShort(id) {
  const mm = parseInt(id.slice(0, 2), 10) - 1;
  return ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][mm];
}
function todayStr() { return new Date().toISOString().split('T')[0]; }
function dateToMonthId(dateStr) {
  const [y, m] = dateStr.split('-');
  return m + y.slice(2);
}

// ── Donut Chart ───────────────────────────────────────────

function DonutChart({ data, size = 160, onSliceClick }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const cx = size / 2, cy = size / 2, r = size * 0.38, inner = size * 0.24;
  if (data.length === 1) {
    return (
      <svg width={size} height={size} style={{ cursor: 'pointer' }} onClick={() => onSliceClick && onSliceClick()}>
        <circle cx={cx} cy={cy} r={(r + inner) / 2} fill="none" stroke={data[0].color} strokeWidth={r - inner} />
      </svg>
    );
  }
  let angle = -Math.PI / 2;
  const slices = data.map(d => {
    const sweep = d.value / total * Math.PI * 2;
    const a1 = angle, a2 = angle + sweep;
    angle = a2;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const xi1 = cx + inner * Math.cos(a1), yi1 = cy + inner * Math.sin(a1);
    const xi2 = cx + inner * Math.cos(a2), yi2 = cy + inner * Math.sin(a2);
    const lg = sweep > Math.PI ? 1 : 0;
    const path = `M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${inner},${inner} 0 ${lg},0 ${xi1},${yi1} Z`;
    return { ...d, path };
  });
  return (
    <svg width={size} height={size} style={{ cursor: 'pointer' }} onClick={() => onSliceClick && onSliceClick()}>
      {slices.map((s, i) => (
        <path key={i} d={s.path} fill={s.color} stroke="#fafaf8" strokeWidth="2"
          style={{ transition: 'opacity .15s' }}
          onMouseEnter={e => e.target.style.opacity = '.75'}
          onMouseLeave={e => e.target.style.opacity = '1'} />
      ))}
    </svg>
  );
}

  const [desc, setDesc] = useState(initialValues?.desc || '');
  const [amt, setAmt] = useState(initialValues ? Math.abs(initialValues.amt).toString() : '');
  const [type, setType] = useState(initialValues?.type || 'g');
  const [medio, setMedio] = useState(initialValues?.medio || (medioList ? medioList[0]?.name : MEDIOS[0]));
  const [date, setDate] = useState(initialValues?.date || todayStr());
  const defaultCat = type === 'i' ? (ingresoCats[0] || 'Ingresos') : (catList ? catList.filter(c => c.key !== 'Ingresos' && c.key !== 'Fábrica')[0]?.name : CATS_GASTO[0]);
  const [cat, setCat] = useState(initialValues?.cat || defaultCat || '');
  const inp = { width: '100%', padding: '8px 10px', border: '1px solid #e8e4de', borderRadius: 8, fontFamily: 'inherit', fontSize: 14, marginTop: 4, outline: 'none', background: '#fff' };

    if (!desc.trim() || !amt || isNaN(Number(amt))) return;
    onSave({ id: Date.now(), month: dateToMonthId(date), date, desc: desc.trim(), cat, medio, amt: type === 'i' ? Math.abs(Number(amt)) : -Math.abs(Number(amt)), type });
    onClose();
  };

  return (
    <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.4)', zIndex: 50, display: 'flex', alignItems: 'flex-end' }} onClick={onClose}>
      <div style={{ width: '100%', background: '#fafaf8', borderRadius: '24px 24px 0 0', padding: '20px 20px 32px' }} onClick={e => e.stopPropagation()}>
        <div style={{ width: 40, height: 4, background: '#e0ddd8', borderRadius: 2, margin: '0 auto 20px' }} />
        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 16 }}>{isEdit ? 'Editar movimiento' : 'Nuevo movimiento'}</div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
          {[['g', 'Gasto'], ['i', 'Ingreso']].map(([v, l]) => (
            <button key={v} onClick={() => setType(v)} style={{ flex: 1, padding: '8px', border: 'none', borderRadius: 8, background: type === v ? '#1a1a1a' : '#f0ede8', color: type === v ? '#fff' : '#555', fontFamily: 'inherit', fontSize: 14, cursor: 'pointer' }}>{l}</button>
          ))}
        </div>
        <label style={{ fontSize: 12, color: '#888', display: 'block' }}>Descripción
          <input style={inp} value={desc} onChange={e => setDesc(e.target.value)} placeholder="ej. Asado" />
        </label>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 10 }}>
          <label style={{ fontSize: 12, color: '#888', display: 'block' }}>Importe
            <input style={inp} value={amt} onChange={e => setAmt(e.target.value)} placeholder="0" type="number" />
          </label>
          <label style={{ fontSize: 12, color: '#888', display: 'block' }}>Fecha
            <input style={inp} value={date} onChange={e => setDate(e.target.value)} type="date" />
          </label>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 10 }}>
          <label style={{ fontSize: 12, color: '#888', display: 'block' }}>Categoría
            <select style={{ ...inp }} value={cat} onChange={e => setCat(e.target.value)}>
              {(type === 'g' ? gastoCats : ingresoCats).map(c => <option key={c}>{c}</option>)}
            </select>
          </label>
          <label style={{ fontSize: 12, color: '#888', display: 'block' }}>Medio
            <select style={{ ...inp }} value={medio} onChange={e => setMedio(e.target.value)}>
              {availableMedios.map(m => <option key={m}>{m}</option>)}

// ── Header minimalista ────────────────────────────────────
// Selector de mes limpio: "‹ Marzo 2026 ›" con fondo sutil

function MonthSelector({ month, allMonths, onMonthChange, light = false }) {
  const monthIdx = allMonths.findIndex(m => m.id === month.id);
  const canPrev = monthIdx < allMonths.length - 1;
  const canNext = monthIdx > 0;
  const btnStyle = (active, lighter) => ({
    background: 'none', border: 'none', cursor: active ? 'pointer' : 'default',
    color: active ? (lighter ? '#4a8a5a' : '#1a1a1a') : (lighter ? '#b8d4be' : '#ccc'),
    fontSize: 20, lineHeight: 1, padding: '0 6px', fontFamily: 'inherit'
  });
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
      <button onClick={() => canPrev && onMonthChange(1)} style={btnStyle(canPrev, light)}>‹</button>
      <span style={{ fontSize: 13, fontWeight: 600, color: light ? '#4a8a5a' : '#555', letterSpacing: '.01em', minWidth: 100, textAlign: 'center' }}>{month.label}</span>
      <button onClick={() => canNext && onMonthChange(-1)} style={btnStyle(canNext, light)}>›</button>
    </div>
  );
}

// ── Screen: Dashboard ─────────────────────────────────────

function Dashboard({ month, txs, allMonths, onNav, onMonthChange, onAddTx, onEditTx, catOverrides = {}, catList = [], medioList = [] }) {

    if (catOverrides[cat]) return catOverrides[cat].color;

        {/* Donut + leyenda */}
        <div style={{ padding: '20px 20px 0', display: 'flex', gap: 16, alignItems: 'center' }}>

// ── Screen: Movimientos ──────────────────────────────────

function Movimientos({ month, txs, allMonths, onNav, onMonthChange, onAddTx, onEditTx, catOverrides = {}, catList = [], medioList = [] }) {

  const resolvedCatColor = cat => {
    if (catOverrides[cat]) return catOverrides[cat].color;
    const found = catList.find(c => c.key === cat || c.name === cat);
    return found ? found.color : catColor(cat);
  };

  const filtered = filter === 'todos' ? txs
    : filter === 'ingresos' ? txs.filter(t => t.type === 'i')

// ── Screen: Categorías ────────────────────────────────────

function Categorias({ month, txs, onNav, catOverrides = {}, onEditCat }) {
  const [activeCat, setActiveCat] = useState(null);
  const [editingCat, setEditingCat] = useState(null);
  const [showCatModal, setShowCatModal] = useState(false);

  const resolvedCatColor = cat => { const ov = catOverrides[cat]; return ov ? ov.color : catColor(cat); };
  const resolvedCatName = cat => { const ov = catOverrides[cat]; return ov ? ov.name : cat; };

  const gastos = txs.filter(t => t.type === 'g');
  const totalGastos = gastos.reduce((s, t) => s + Math.abs(t.amt), 0);
  const catMap = {};
  gastos.forEach(t => { catMap[t.cat] = (catMap[t.cat] || 0) + Math.abs(t.amt); });
  const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
  const maxCat = cats[0]?.[1] || 1;

  return (
    <div className="screen">
      <div className="screen-header" style={{ background: '#e8f2ec' }}>
        <div style={{ padding: '14px 20px 14px' }}>
          <div style={{ fontSize: 11, color: '#6a9a72', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 4 }}>{month.label}</div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <div style={{ fontSize: 22, fontWeight: 700, color: '#1a1a1a' }}>Categorías</div>
            <div style={{ fontSize: 13, color: '#5a9a6a' }}>{fmtFull(totalGastos)}</div>
          </div>
        </div>
      </div>

      <div className="scroll">
        <div style={{ padding: '16px 16px 24px', display: 'flex', flexDirection: 'column', gap: 8 }}>
          {cats.map(([cat, val]) => {
            const catTxs = txs.filter(t => t.cat === cat);
            const isOpen = activeCat === cat;
            return (
              <div key={cat}>
                <div className="card" style={{ cursor: 'pointer', outline: isOpen ? `2px solid ${resolvedCatColor(cat)}` : 'none', overflow: 'hidden' }} onClick={() => setActiveCat(isOpen ? null : cat)}>
                  <div style={{ padding: '12px 16px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div style={{ width: 12, height: 12, borderRadius: 4, background: resolvedCatColor(cat) }} />
                        <span style={{ fontSize: 14, fontWeight: 500 }}>{resolvedCatName(cat)}</span>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div style={{ textAlign: 'right' }}>
                          <span style={{ fontSize: 14, fontWeight: 700 }}>{fmtFull(val)}</span>
                          <span style={{ fontSize: 11, color: '#aaa', marginLeft: 6 }}>{Math.round(val / totalGastos * 100)}%</span>
                        </div>
                        <div style={{ fontSize: 15, color: '#bbb', cursor: 'pointer', padding: '4px' }} onClick={e => { e.stopPropagation(); setEditingCat({ name: resolvedCatName(cat), color: resolvedCatColor(cat), originalKey: cat }); }}>✎</div>
                        <span style={{ fontSize: 12, color: '#aaa', transition: 'transform .2s', display: 'inline-block', transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)' }}>▾</span>
                      </div>
                    </div>
                    <div style={{ height: 6, borderRadius: 3, background: '#f0ede8', overflow: 'hidden' }}>
                      <div style={{ height: '100%', borderRadius: 3, background: resolvedCatColor(cat), width: `${val / maxCat * 100}%`, transition: 'width .4s' }} />
                    </div>
                    <div style={{ fontSize: 11, color: '#aaa', marginTop: 4 }}>
                      {catTxs.length} movimiento{catTxs.length !== 1 ? 's' : ''}
                    </div>
                  </div>
                  {isOpen && (
                    <div style={{ borderTop: `1px solid ${resolvedCatColor(cat)}33` }}>
                      {catTxs.map((tx, i) => (
                        <div key={tx.id}>
                          {i > 0 && <div style={{ height: 1, background: '#f0ede8', margin: '0 16px' }} />}
                          <div className="tx-row" style={{ background: '#fafaf8' }}>
                            <div className="tx-info">
                              <div className="tx-desc">{tx.desc}</div>
                              <div className="tx-meta">{new Date(tx.date + 'T12:00:00').toLocaleDateString('es-AR')} · {tx.medio}</div>
                            </div>
                            <div className={`tx-amt ${tx.type === 'i' ? 'pos' : 'neg'}`}>
                              {tx.type === 'i' ? '+' : '-'}{fmtFull(tx.amt)}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div onClick={() => setShowCatModal(true)} style={{ position: 'absolute', bottom: 80, right: 20, width: 52, height: 52, borderRadius: 26, background: '#3a7a50', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 4px 16px rgba(58,122,80,0.35)', fontSize: 28, color: '#fff', userSelect: 'none', zIndex: 10 }}>+</div>
      {showCatModal && <NewCategoryModal onClose={() => setShowCatModal(false)} onSave={onEditCat} />}
      {editingCat && <NewCategoryModal initialValues={editingCat} onClose={() => setEditingCat(null)} onSave={({ oldName, name, color }) => { onEditCat({ oldName: editingCat.originalKey, name, color }); setEditingCat(null); }} />}
      <BottomNav screen="categorias" onNav={onNav} />

// ── Screen: Anual ─────────────────────────────────────────

function Anual({ currentMonthId, allMonths, allTx, onNav, onSelectMonth }) {
  const [hovered, setHovered] = useState(null);
  const [viewMode, setViewMode] = useState('monto');

  const monthStats = allMonths.map(m => {
    const txs = allTx.filter(t => t.month === m.id);
    const ingresos = txs.filter(t => t.type === 'i').reduce((s, t) => s + t.amt, 0);
    const gastos = Math.abs(txs.filter(t => t.type === 'g').reduce((s, t) => s + t.amt, 0));
    return { ...m, ingresos, gastos, neto: ingresos - gastos };
  });

  const maxAbs = Math.max(...monthStats.map(m => Math.abs(m.neto)), 1);
  const totalNeto = monthStats.reduce((s, m) => s + m.neto, 0);
  const activeMths = monthStats.filter(m => m.ingresos > 0 || m.gastos > 0).length;
  const promedioNeto = activeMths ? totalNeto / activeMths : 0;

  const byYear = {};
  monthStats.forEach(m => {
    const yr = '20' + m.id.slice(2);
    if (!byYear[yr]) byYear[yr] = [];
    byYear[yr].unshift(m);
  });

  const netoLabel = m => {
    if (viewMode === 'pct') {
      if (!m.ingresos) return '—';
      return Math.round(m.neto / m.ingresos * 100) + '%';
    }
    return (m.neto >= 0 ? '+' : '') + fmt(m.neto);
  };

  return (
    <div className="screen">
      <div className="screen-header" style={{ background: '#fafaf8', borderBottom: '1px solid #e8e4de' }}>
        <div style={{ padding: '14px 20px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 700, color: '#1a1a1a' }}>Vista Anual</div>
            <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>
              Neto: {fmtFull(totalNeto)} · Prom: {fmt(promedioNeto)}/mes
            </div>
          </div>
          <div style={{ display: 'flex', gap: 4, marginTop: 4 }}>
            {['monto', 'pct'].map(mode => (
              <button key={mode} onClick={() => setViewMode(mode)} style={{
                padding: '5px 12px', borderRadius: 16, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600,
                background: viewMode === mode ? '#1a1a1a' : '#e8e4de',
                color: viewMode === mode ? '#fff' : '#888', transition: 'all .15s'
              }}>{mode === 'monto' ? '$' : '%'}</button>
            ))}
          </div>
        </div>
      </div>

      <div className="scroll">
        {Object.entries(byYear).sort((a, b) => b[0].localeCompare(a[0])).map(([year, months]) => (
          <div key={year} style={{ padding: '16px 16px 0' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: '#aaa', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 8 }}>{year}</div>
            {/* Gráfico bidireccional neto */}
            <div style={{ position: 'relative', height: 90, marginBottom: 4, padding: '0 4px' }}>
              {/* Línea base central */}
              <div style={{ position: 'absolute', top: '50%', left: 0, right: 0, height: 1, background: '#e0dcd8' }} />
              <div style={{ display: 'flex', gap: 4, alignItems: 'stretch', height: '100%' }}>
                {months.map(m => {
                  const barH = Math.max(3, Math.abs(m.neto) / maxAbs * 42);
                  const isPos = m.neto >= 0;
                  const isActive = m.id === currentMonthId;
                  const isHov = hovered === m.id;
                  const barColor = isActive ? '#1a1a1a' : isPos ? '#4a9a6a' : '#c04030';
                  const barColorHov = isActive ? '#333' : isPos ? '#2d7a52' : '#a03020';
                  return (
                    <div key={m.id} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', position: 'relative' }}
                      onClick={() => { onSelectMonth(m.id); onNav('dashboard'); }}
                      onMouseEnter={() => setHovered(m.id)} onMouseLeave={() => setHovered(null)}>
                      {/* Tooltip hover */}
                      {isHov && (
                        <div style={{ position: 'absolute', top: isPos ? (45 - barH - 20) : (45 + barH - 4), left: '50%', transform: 'translateX(-50%)', background: '#1a1a1a', color: '#fff', fontSize: 9, padding: '2px 5px', borderRadius: 4, whiteSpace: 'nowrap', zIndex: 5 }}>
                          {netoLabel(m)}
                        </div>
                      )}
                      {/* Mitad superior (positivo) */}
                      <div style={{ flex: 1, display: 'flex', alignItems: 'flex-end', width: '100%', paddingBottom: 0.5 }}>
                        {isPos && <div style={{ width: '100%', height: barH, borderRadius: '3px 3px 0 0', background: isHov ? barColorHov : barColor, transition: 'all .15s' }} />}
                      </div>
                      {/* Mitad inferior (negativo) */}
                      <div style={{ flex: 1, display: 'flex', alignItems: 'flex-start', width: '100%', paddingTop: 0.5 }}>
                        {!isPos && <div style={{ width: '100%', height: barH, borderRadius: '0 0 3px 3px', background: isHov ? barColorHov : barColor, transition: 'all .15s' }} />}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            {/* Labels de meses */}
            <div style={{ display: 'flex', gap: 4, padding: '0 4px', marginBottom: 12 }}>
              {months.map(m => {
                const isActive = m.id === currentMonthId;
                return (
                  <div key={m.id} style={{ flex: 1, textAlign: 'center', cursor: 'pointer' }} onClick={() => { onSelectMonth(m.id); onNav('dashboard'); }}>
                    <span style={{ fontSize: 9, color: isActive ? '#1a1a1a' : '#aaa', fontWeight: isActive ? 700 : 400 }}>{m.short}</span>
                  </div>
                );
              })}
            </div>
            <div className="card" style={{ marginBottom: 16 }}>
              {months.map((m, i) => {
                const isActive = m.id === currentMonthId;
                return (
                  <div key={m.id}>
                    {i > 0 && <div style={{ height: 1, background: '#f0ede8', margin: '0 16px' }} />}
                    <div className="tx-row" style={{ background: isActive ? '#f5f2ec' : 'transparent' }}
                      onClick={() => { onSelectMonth(m.id); onNav('dashboard'); }}>
                      <div style={{ width: 4, height: 32, borderRadius: 2, background: isActive ? '#1a1a1a' : 'transparent', flexShrink: 0 }} />
                      <div className="tx-info">
                        <div className="tx-desc">{m.label}</div>
                        <div className="tx-meta">+{fmt(m.ingresos)} / −{fmt(m.gastos)}</div>
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        <div style={{ fontSize: 14, fontWeight: 700, color: m.neto >= 0 ? '#2d7a52' : '#c04030' }}>
                          {netoLabel(m)}
                        </div>
                        <div style={{ fontSize: 11, color: '#aaa' }}>{viewMode === 'pct' ? 'ahorro' : 'neto'}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
        <div style={{ height: 16 }} />
      </div>
      <BottomNav screen="anual" onNav={onNav} />
    </div>
  );
}

// ── Screen: Ajustes ──────────────────────────────────────

const COLOR_PALETTE = [
  '#e8b86d','#7eb8d4','#d4876b','#a78bda','#6bbf8e','#e88ba0',
  '#f0c060','#60b4b4','#88c070','#d490c0','#b0aaaa','#5a9cd4',
  '#98d0a0','#d0a8d0','#c8a080','#ff6b6b','#ffd93d','#6bcb77',
  '#4d96ff','#845ec2','#ff9671','#00c9a7','#f9c74f','#43aa8b',
  '#e76f51','#2ec4b6','#cbf3f0','#ffbf69','#9b5de5','#f15bb5'
];

function DraggableList({ items, onReorder, onEdit, onDelete, hasColor, addLabel, onAdd }) {
  const [editingIdx, setEditingIdx] = useState(null);
  const [editVal, setEditVal] = useState({});
  const [showColorIdx, setShowColorIdx] = useState(null);
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);

  const startEdit = i => { setEditingIdx(i); setEditVal({ name: items[i].name, color: items[i].color || '' }); setShowColorIdx(null); };
  const saveEdit = i => { if (editVal.name?.trim()) onEdit(i, editVal); setEditingIdx(null); setShowColorIdx(null); };

  const handleDragStart = (e, i) => { setDragIdx(i); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', i); };
  const handleDragOver = (e, i) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOverIdx(i); };
  const handleDrop = (e, i) => { e.preventDefault(); if (dragIdx !== null && dragIdx !== i) { const a = [...items]; const [r] = a.splice(dragIdx, 1); a.splice(i, 0, r); onReorder(a); } setDragIdx(null); setDragOverIdx(null); };
  const handleDragEnd = () => { setDragIdx(null); setDragOverIdx(null); };

  const inp = { flex: 1, padding: '6px 8px', border: '1px solid #e8e4de', borderRadius: 8, fontFamily: 'inherit', fontSize: 14, outline: 'none', background: '#fafaf8' };

  return (
    <div>
      <div className="card" style={{ margin: '0 16px' }}>
        {items.map((item, i) => (
          <div key={item.key || item.name} draggable={editingIdx !== i}
            onDragStart={e => handleDragStart(e, i)} onDragOver={e => handleDragOver(e, i)}
            onDrop={e => handleDrop(e, i)} onDragEnd={handleDragEnd}
            style={{ opacity: dragIdx === i ? 0.4 : 1, background: dragOverIdx === i && dragIdx !== i ? '#e4f2e8' : 'transparent', transition: 'background .1s' }}>
            {i > 0 && <div style={{ height: 1, background: '#f0ede8', margin: '0 16px' }} />}
            {editingIdx === i ? (
              <div style={{ padding: '10px 16px', display: 'flex', gap: 8, alignItems: 'center', position: 'relative' }}>
                {hasColor && (
                  <div style={{ position: 'relative', flexShrink: 0 }}>
                    <div onClick={() => setShowColorIdx(showColorIdx === i ? null : i)} style={{ width: 28, height: 28, borderRadius: 14, background: editVal.color, border: '2px solid #e8e4de', cursor: 'pointer' }} />
                    {showColorIdx === i && (
                      <div style={{ position: 'absolute', top: 34, left: 0, zIndex: 20, background: '#fff', padding: 8, borderRadius: 10, border: '1px solid #e8e4de', display: 'flex', flexWrap: 'wrap', gap: 5, width: 168, boxShadow: '0 4px 16px rgba(0,0,0,.12)' }}>
                        {COLOR_PALETTE.map(c => (
                          <div key={c} onClick={() => { setEditVal(v => ({ ...v, color: c })); setShowColorIdx(null); }} style={{ width: 24, height: 24, borderRadius: 12, background: c, cursor: 'pointer', boxShadow: editVal.color === c ? '0 0 0 2px #1a1a1a' : '' }} />
                        ))}
                      </div>
                    )}
                  </div>
                )}
                <input style={inp} value={editVal.name} onChange={e => setEditVal(v => ({ ...v, name: e.target.value }))} autoFocus onKeyDown={e => e.key === 'Enter' && saveEdit(i)} />
                <button onClick={() => saveEdit(i)} style={{ padding: '6px 12px', background: '#1a1a1a', color: '#fff', border: 'none', borderRadius: 8, fontFamily: 'inherit', fontSize: 13, cursor: 'pointer' }}>OK</button>
                <button onClick={() => setEditingIdx(null)} style={{ padding: '6px 10px', background: '#f0ede8', color: '#555', border: 'none', borderRadius: 8, fontFamily: 'inherit', fontSize: 13, cursor: 'pointer' }}>✕</button>
              </div>
            ) : (
              <div style={{ padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ fontSize: 18, color: '#ccc', cursor: 'grab', userSelect: 'none', flexShrink: 0, lineHeight: 1 }}>⠿</span>
                {hasColor && <div style={{ width: 14, height: 14, borderRadius: 7, background: item.color, flexShrink: 0 }} />}
                <span style={{ flex: 1, fontSize: 14, fontWeight: 500 }}>{item.name}</span>
                <div style={{ display: 'flex', gap: 2, alignItems: 'center' }}>
                  <button onClick={() => startEdit(i)} style={{ background: 'none', border: 'none', fontSize: 15, cursor: 'pointer', color: '#bbb', padding: '2px 6px' }}>✎</button>
                  <button onClick={() => onDelete(i)} style={{ background: 'none', border: 'none', fontSize: 15, cursor: 'pointer', color: '#e09090', padding: '2px 4px' }}>✕</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      <button onClick={onAdd} style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '8px 16px 0', padding: '10px 16px', background: '#f5f2ec', border: 'none', borderRadius: 10, fontFamily: 'inherit', fontSize: 14, color: '#555', cursor: 'pointer', width: 'calc(100% - 32px)' }}>
        <span style={{ fontSize: 18, color: '#3a7a50', fontWeight: 700, lineHeight: 1 }}>+</span> {addLabel}
      </button>
    </div>
  );
}

function Ajustes({ catGastoList, catIngresoList, medioList, onUpdateCatGasto, onUpdateCatIngreso, onUpdateMedios, onNav }) {
  return (
    <div className="screen">
      <div className="screen-header" style={{ background: '#e8f2ec', borderBottom: '1px solid #c8dcc8' }}>
        <div style={{ padding: '14px 20px 14px' }}>
          <div style={{ fontSize: 22, fontWeight: 700, color: '#1a1a1a' }}>Ajustes</div>
          <div style={{ fontSize: 12, color: '#4a8a58', marginTop: 2 }}>Arrastrá para reordenar</div>
        </div>
      </div>
      <div className="scroll" style={{ paddingTop: 20 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#888', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 10, padding: '0 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span>Categorías de gastos</span>
          <button onClick={() => onUpdateCatGasto([...catGastoList].sort((a, b) => a.name.localeCompare(b.name, 'es')))} style={{ background: 'none', border: '1px solid #ccc', borderRadius: 6, padding: '2px 8px', fontSize: 11, color: '#888', cursor: 'pointer', fontFamily: 'inherit' }}>A–Z</button>
        </div>
        <DraggableList items={catGastoList} hasColor onReorder={onUpdateCatGasto}
          onEdit={(i, val) => { const a = [...catGastoList]; a[i] = { ...a[i], ...val }; onUpdateCatGasto(a); }}
          onDelete={i => { const a = [...catGastoList]; a.splice(i, 1); onUpdateCatGasto(a); }}
          onAdd={() => onUpdateCatGasto([...catGastoList, { key: 'cg_' + Date.now(), name: 'Nueva categoría', color: '#b0aaaa' }])}
          addLabel="Agregar categoría de gasto" />

        <div style={{ fontSize: 11, fontWeight: 700, color: '#888', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 10, padding: '20px 20px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span>Categorías de ingresos</span>
          <button onClick={() => onUpdateCatIngreso([...catIngresoList].sort((a, b) => a.name.localeCompare(b.name, 'es')))} style={{ background: 'none', border: '1px solid #ccc', borderRadius: 6, padding: '2px 8px', fontSize: 11, color: '#888', cursor: 'pointer', fontFamily: 'inherit' }}>A–Z</button>
        </div>
        <DraggableList items={catIngresoList} hasColor onReorder={onUpdateCatIngreso}
          onEdit={(i, val) => { const a = [...catIngresoList]; a[i] = { ...a[i], ...val }; onUpdateCatIngreso(a); }}
          onDelete={i => { const a = [...catIngresoList]; a.splice(i, 1); onUpdateCatIngreso(a); }}
          onAdd={() => onUpdateCatIngreso([...catIngresoList, { key: 'ci_' + Date.now(), name: 'Nueva categoría', color: '#6bbf8e' }])}
          addLabel="Agregar categoría de ingreso" />

        <div style={{ fontSize: 11, fontWeight: 700, color: '#888', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 10, padding: '20px 20px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span>Medios de pago</span>
          <button onClick={() => onUpdateMedios([...medioList].sort((a, b) => a.name.localeCompare(b.name, 'es')))} style={{ background: 'none', border: '1px solid #ccc', borderRadius: 6, padding: '2px 8px', fontSize: 11, color: '#888', cursor: 'pointer', fontFamily: 'inherit' }}>A–Z</button>
        </div>
        <DraggableList items={medioList} hasColor={false} onReorder={onUpdateMedios}
          onEdit={(i, val) => { const a = [...medioList]; a[i] = { ...a[i], name: val.name }; onUpdateMedios(a); }}
          onDelete={i => { const a = [...medioList]; a.splice(i, 1); onUpdateMedios(a); }}
          onAdd={() => onUpdateMedios([...medioList, { key: 'mp_' + Date.now(), name: 'Nuevo medio' }])}
          addLabel="Agregar medio de pago" />

        <div style={{ height: 24 }} />
      </div>
      <BottomNav screen="ajustes" onNav={onNav} />
    </div>
  );
}

// ── App ───────────────────────────────────────────────────

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('gastos-state') || '{}'); } catch { return {}; } })();

  const [screen, setScreen] = useState(saved.screen || 'dashboard');
  const [monthId, setMonthId] = useState(saved.monthId || '0326');
  const [extraTx, setExtraTx] = useState(saved.extraTx || []);
  const [txOverrides, setTxOverrides] = useState(saved.txOverrides || {});
  const [catOverrides, setCatOverrides] = useState(saved.catOverrides || {});

  const [catGastoList, setCatGastoList] = useState(() =>
    saved.catGastoList || Object.entries(CAT_COLORS).filter(([k]) => k !== 'Ingresos' && k !== 'Fábrica').map(([key, color]) => ({ key, name: key, color }))
  );
  const [catIngresoList, setCatIngresoList] = useState(() =>
    saved.catIngresoList || [
      { key: 'Ingresos', name: 'Ingresos', color: '#2d7a52' },
      { key: 'Fábrica', name: 'Fábrica', color: '#2d7a52' }
    ]
  );
  const [medioList, setMedioList] = useState(() => saved.medioList || MEDIOS.map(m => ({ key: m, name: m })));

  const catColor2 = useCallback(key => {
    const found = [...catGastoList, ...catIngresoList].find(c => c.key === key);
    return found ? found.color : '#b0aaaa';
  }, [catGastoList, catIngresoList]);

  const addTx = useCallback(tx => { setExtraTx(prev => [tx, ...prev]); setMonthId(tx.month); }, []);
  const updateTx = useCallback(tx => { setTxOverrides(prev => ({ ...prev, [tx.id]: tx })); setMonthId(tx.month); }, []);
  const updateCat = useCallback(({ oldName, name, color }) => { setCatOverrides(prev => ({ ...prev, [oldName || name]: { name, color } })); }, []);

  const nav = useCallback(s => { setScreen(s); }, []);
  const selectMonth = useCallback(id => { setMonthId(id); }, []);

  useEffect(() => {
    try {
      localStorage.setItem('gastos-state', JSON.stringify({
        screen, monthId, extraTx, txOverrides, catOverrides, catGastoList, catIngresoList, medioList
      }));
    } catch(e) {}
  }, [screen, monthId, extraTx, txOverrides, catOverrides, catGastoList, catIngresoList, medioList]);

  const allTx = useMemo(() => {
    return [...extraTx, ...ALL_TX].map(t => txOverrides[t.id] ? { ...t, ...txOverrides[t.id] } : t);
  }, [extraTx, txOverrides]);

  const allMonths = useMemo(() => {
    const known = new Map(MONTHS.map(m => [m.id, m]));
    allTx.forEach(t => {
      if (!known.has(t.month)) {
        known.set(t.month, { id: t.month, label: monthIdToLabelFull(t.month), short: monthIdToShort(t.month), saldoInicial: 0, cuotas: 0 });
      }
    });
    return [...known.values()].sort((a, b) => {
      const toSort = id => id.slice(2) + id.slice(0, 2);
      return toSort(b.id).localeCompare(toSort(a.id));
    });
  }, [allTx]);

  const changeMonth = useCallback(dir => {
    const idx = allMonths.findIndex(m => m.id === monthId);
    const next = allMonths[idx + dir];
    if (next) { setMonthId(next.id); }
  }, [monthId, screen, allMonths]);

  const txs = allTx.filter(t => t.month === monthId);
  const month = allMonths.find(m => m.id === monthId) || allMonths[0];

  const catList = [...catGastoList, ...catIngresoList];

  const screens = {
    dashboard: <Dashboard month={month} txs={txs} allMonths={allMonths} onNav={nav} onMonthChange={changeMonth} onAddTx={addTx} onEditTx={updateTx} catOverrides={catOverrides} catList={catList} medioList={medioList} />,
    movimientos: <Movimientos month={month} txs={txs} allMonths={allMonths} onNav={nav} onMonthChange={changeMonth} onAddTx={addTx} onEditTx={updateTx} catOverrides={catOverrides} catList={catList} medioList={medioList} />,
    categorias: <Categorias month={month} txs={txs} onNav={nav} catOverrides={catOverrides} onEditCat={updateCat} />,
    anual: <Anual currentMonthId={monthId} allMonths={allMonths} allTx={allTx} onNav={nav} onSelectMonth={selectMonth} />,
    ajustes: <Ajustes catGastoList={catGastoList} catIngresoList={catIngresoList} medioList={medioList} onUpdateCatGasto={setCatGastoList} onUpdateCatIngreso={setCatIngresoList} onUpdateMedios={setMedioList} onNav={nav} />
  };

  return screens[screen] || screens.dashboard;
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
